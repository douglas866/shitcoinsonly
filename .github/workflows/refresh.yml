name: refresh-snapshot
# Regenerates the SSR snapshot (homepage, section pages, per-coin pages, sitemap)
# from live CoinGecko + exchange data so the crawler / no-JS view never goes stale.
on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: refresh-snapshot
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Regenerate snapshot
        run: node tools/build.mjs
      - name: Commit if changed
        run: |
          git config user.name "shitcoinsonly-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "chore: refresh market snapshot"
            git push
          fi
